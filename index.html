<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- stylesheets -->
     <link rel="stylesheet" href="src/css/normalize.css"/>
     <link rel="stylesheet" href="src/css/reset.css"/>
     <link rel="stylesheet" href="src/css/style.css"/>

   
  </head>
  <body>
    <form action="#" class="todolist" autocomplete="off">
      <!--Add a new task  -->
      <div class="todolist__new-task">

        <!--List of todos -->
        <div class="new-task__input-group">
          <label for="new-task">Add a task</label>
          <input 
            type="text"
            id="new-task"
            name="new-task"
            placeholder="E.g. Buy groceries"/>
        </div>

        <button type="submit">
          <svg viewBox="0 0 10 10" width=".65em" height=".65em" >
            <path d="M6 4h4v2H6v4H4V6H0V4h4V0h2z" fill-rule="nonzero" />
          </svg>
          <span>Add task</span>
        </button>
      </div> 
      
      <!-- todo list tasks-->
       <ul class="todolist__tasks"></ul>

      <!-- todo list empty state -->
      <div class="todolist__empty-state">
        Your todo list is empty. Hurray! 🎉
      </div>
    </form>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/1.0.7/purify.min.js"></script>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
